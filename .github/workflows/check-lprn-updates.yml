name: Check LPRN Annual Review Updates

on:
  schedule:
    # Runs on the 1st and 15th of every month at 09:00 UTC
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check LPRN annual review page for new reports
        id: check
        run: |
          python -c "
          import urllib.request
          import re

          url = 'https://www.leavenetwork.org/annual-review-reports/'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
                  matches = re.findall(r'(202[6-9]|203[0-9])\s+review', html, re.IGNORECASE)
                  if matches:
                      print(f'NEW_EDITION_FOUND=true')
                      print(f'FOUND_YEARS={list(set(matches))}')
                  else:
                      print('NEW_EDITION_FOUND=false')
          except Exception as e:
              print(f'Check error: {e}')
              print('NEW_EDITION_FOUND=false')
          " >> $GITHUB_OUTPUT

      - name: Open notification issue if new edition is detected
        if: steps.check.outputs.NEW_EDITION_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const year = process.env.FOUND_YEARS || 'nouvelle edition';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Notification: Nouvelle edition LPRN detectee (${year})`,
              body: `Une nouvelle edition de l'International Review of Leave Policies and Research a ete detectee sur https://www.leavenetwork.org/annual-review-reports/.\n\nVous pouvez lancer le script d'ingestion avec :\n\`\`\`bash\npython scripts/ingest_lprn_edition.py --input /chemin/vers/fichier.pdf --year ${year}\n\`\`\``
            });
        env:
          FOUND_YEARS: ${{ steps.check.outputs.FOUND_YEARS }}
